playbook: playbooks/hello_world.yml
inventory: inventory/inventory.yaml
limit: localhost
working_directory: "."
extra_vars:
  debug: true
  secure_deployment: true
verbose: 1
become: true
become_user: root
become_method: sudo
become_password_file: ~/.ansible/become_password
vault_password_file: ~/.ansible/vault_password
private_key: ~/.ssh/ansible_key
connection: ssh
connection_password_file: ~/.ansible/ssh_password
metadata:
  name: "Secure Deployment Test"
  description: "Test configuration with all password file options"
  max_runs: 10
  run_count: 0